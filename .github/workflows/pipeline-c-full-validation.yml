name: Full Validation

on:
  workflow_dispatch:

jobs:
  full-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verify Terraform Installation
        run: terraform version

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get VM Public IP
        id: vm_ip
        working-directory: terraform
        run: |
          echo "VM_IP=$(terraform output -raw vm_public_ip)" >> $GITHUB_ENV

      - name: Display VM Public IP
        run: |
          echo "VM Public IP: $VM_IP"

      - name: Create SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > iclim_key
          chmod 600 iclim_key

      - name: Wait for SSH
        run: |
          for i in {1..30}; do
            echo "Attempt $i..."
            echo "Connecting to $VM_IP..."

            ssh \
              -i iclim_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              azureuser@$VM_IP "echo SSH Ready" && exit 0

            echo "Waiting 10 seconds..."
            sleep 10
          done

          echo "SSH never became available."
          exit 1

      - name: Package ICLIM
        run: |
          tar -czf iclim.tar.gz \
            agents \
            analysis \
            config \
            utils \
            Dockerfile \
            requirements.txt \
            README.md

          ls -lh iclim.tar.gz

      - name: Copy Package to VM
        run: |
          scp \
            -i iclim_key \
            -o StrictHostKeyChecking=no \
            iclim.tar.gz \
            azureuser@$VM_IP:~

      - name: Extract Package
        run: |
          ssh \
            -i iclim_key \
            -o StrictHostKeyChecking=no \
            azureuser@$VM_IP << 'EOF'

          rm -rf ~/iclim

          mkdir ~/iclim

          tar -xzf ~/iclim.tar.gz -C ~/iclim

          ls -la ~/iclim

          EOF