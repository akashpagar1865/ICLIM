name: Full Validation

on:
  workflow_dispatch:

jobs:
  full-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verify Terraform Installation
        run: terraform version

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Get VM Public IP
        id: vm_ip
        working-directory: terraform
        run: |
          echo "VM_IP=$(terraform output -raw vm_public_ip)" >> $GITHUB_ENV

      - name: Display VM Public IP
        run: |
          echo "VM Public IP: $VM_IP"

      - name: Create SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > iclim_key
          chmod 600 iclim_key

      - name: Wait for SSH
        run: |
          for i in {1..30}; do
            echo "Attempt $i..."
            echo "Connecting to $VM_IP..."

            ssh \
              -i iclim_key \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=5 \
              azureuser@$VM_IP "echo SSH Ready" && exit 0

            echo "Waiting 10 seconds..."
            sleep 10
          done

          echo "SSH never became available."
          exit 1

      - name: Package ICLIM
        run: |
          tar -czf iclim.tar.gz \
            agents \
            analysis \
            config \
            utils \
            Dockerfile \
            requirements.txt \
            README.md

          ls -lh iclim.tar.gz

      - name: Copy Package to VM
        run: |
          scp \
            -i iclim_key \
            -o StrictHostKeyChecking=no \
            iclim.tar.gz \
            azureuser@$VM_IP:~

      - name: Deploy ICLIM
        run: |
          ssh \
            -i iclim_key \
            -o StrictHostKeyChecking=no \
            azureuser@$VM_IP << 'EOF'

          set -e

          # Verify Docker installation
          if command -v docker >/dev/null 2>&1; then
              echo "Docker already installed."
          else
              echo "Installing Docker..."

              sudo apt-get update
              sudo apt-get install -y docker.io

              sudo systemctl enable docker
              sudo systemctl start docker
          fi

          # Verify Docker installation
          sudo docker --version
          sudo systemctl is-active docker

          # Prepare deployment directory
          rm -rf ~/iclim
          mkdir ~/iclim

          # Extract application package
          tar -xzf ~/iclim.tar.gz -C ~/iclim

          # Build Docker image
          cd ~/iclim
          sudo docker build -t iclim:latest .

          # Remove existing container (if any)
          sudo docker rm -f iclim || true

          # Verify image creation
          sudo docker images | grep iclim

          # Start ICLIM container
          sudo docker run -d \
              --name iclim \
              --restart unless-stopped \
              iclim:latest

          echo "Waiting 60 seconds for ICLIM to initialize..."
          sleep 60    

          # Verify running container
          echo "=== Running Containers ==="
          sudo docker ps | grep iclim

          sudo docker inspect iclim --format='Container Status: {{.State.Status}}'

          #Display Application logs
          echo
          echo "=== Application logs ==="
          sudo docker exec iclim tail -20 /app/logs/iclim.log

          # Display container logs
          echo
          echo "=== Container Logs ==="
          sudo docker logs --tail 50 iclim

          echo
          echo "=== Deployment Status ==="

          if sudo docker ps --format "{{.Names}}" | grep -q "^iclim$"; then
              echo "Container Status: RUNNING"
          else
              echo "Container Status: FAILED"
              exit 1
          fi

          echo "ICLIM deployment completed successfully."

          EOF

      - name: Deployment Summary
        run: |
          echo "====================================="
          echo " ICLIM Full Validation Successful"
          echo "====================================="
          echo "Terraform Apply      : SUCCESS"
          echo "SSH Connectivity     : SUCCESS"
          echo "Application Copy     : SUCCESS"
          echo "Docker Build         : SUCCESS"
          echo "Container Started    : SUCCESS"
          echo "Runtime Validation   : SUCCESS"
          echo "====================================="

  cleanup:
    name: Cleanup Azure Infrastructure
    runs-on: ubuntu-latest

    needs: deploy

    if: always()

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Destroy Infrastructure
        run: terraform destroy -auto-approve

      - name: Cleanup Summary
        run: |
          echo "=================================="
          echo "Cleanup Job Complete"
          echo "Terraform destroy executed."
          echo "=================================="