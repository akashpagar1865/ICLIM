name: Pipeline A - Continuous Integration
on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python Dependencies
      run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

    - name: Build Docker Image
      run: |
            docker build -t iclim:ci .

    - name: Start Docker Container
      run: |
            docker run -d --name iclim-test iclim:ci

    - name: Wait for Startup
      run: sleep 60

    - name: Show Container Logs
      run: docker logs iclim-test

    - name: Verify Application Startup
      run: |
            docker logs iclim-test 2>&1 | grep "First snapshot collected"

    - name: Cleanup
      if: always()
      run: |
            docker stop iclim-test
            docker rm iclim-test

    
